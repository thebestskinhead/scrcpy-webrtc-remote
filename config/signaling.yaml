# Signaling Server Configuration
host: "0.0.0.0"
port: 8080

# Static frontend directory — the app UI lives at /app/ under this dir.
static_dir: "./signaling/static"

# WebRTC ICE server configuration – signaling distributes this to every
# browser / agent client on connect.
webrtc:
  # STUN servers (used for candidate gathering, NAT typing)
  stun_servers:
    - "stun:stun.l.google.com:19302"

  # TURN relay servers (used when direct P2P fails).
  # The standalone signaling server supports "none" (no auth) and "static"
  # (username + credential) modes. When TURN is not needed, leave this empty.
  turn_servers: []

  # Example: password-less TURN
  # turn_servers:
  #   - urls:
  #       - "turn:turn.example.com:3478"
  #     auth:
  #       mode: "none"

  # Example: TURN with static credentials
  # turn_servers:
  #   - urls:
  #       - "turn:turn.example.com:3478?transport=udp"
  #     auth:
  #       mode: "static"
  #       username: "user"
  #       credential: "pass"
